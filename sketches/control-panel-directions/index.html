<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Control Panel · direcciones visuales</title>
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#e4e4e8;font:14px/1.45 system-ui,-apple-system,sans-serif}.gallery{max-width:1080px;margin:auto}.intro{margin:0 0 18px}.intro h1{font-size:20px;margin:0 0 4px;font-weight:680}.intro p{margin:0;color:#9b9ba5}.variant{margin:0 0 30px}.caption{display:flex;align-items:baseline;gap:12px;margin:0 0 9px}.caption b{font-size:15px}.caption span{color:#9999a5;font-size:12px}.frame{overflow:hidden;border:1px solid #444650;border-radius:12px;box-shadow:0 12px 38px #0005}.mock{--bg:#171820;--side:#111218;--surface:#20212a;--line:#373843;--fg:#e7e8ee;--muted:#989ba8;--accent:#f0a43e;--soft:#352b23;--font:system-ui,-apple-system,sans-serif;display:grid;grid-template-columns:164px minmax(0,1fr);grid-template-rows:50px 590px;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:11px}.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 17px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em;font-size:13px}.brand-mark{width:21px;height:21px;display:grid;place-items:center;background:var(--accent);color:#171820;border-radius:6px;font-size:13px}.top-right{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:10px}.window-dot{width:15px;height:15px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:12px}.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.profile{margin:14px 10px 13px;padding:10px 11px;border-bottom:1px solid var(--line)}.profile small{display:block;color:var(--muted);font-size:9px;margin-bottom:3px}.profile strong{font-size:11px}.profile strong:before{content:'●';font-size:7px;color:var(--accent);margin-right:7px}.nav{display:flex;flex-direction:column;gap:2px;padding:0 7px}.nav button{appearance:none;border:0;background:none;color:var(--muted);text-align:left;font:inherit;font-size:10px;padding:9px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .17s,color .17s}.nav button:hover{background:var(--soft);color:var(--fg)}.nav button.active{background:var(--soft);color:var(--fg);font-weight:700}.nav button.dev:after{content:'DEV';float:right;font-size:7px;color:var(--muted);letter-spacing:.06em;padding-top:2px}.side-foot{margin:auto 14px 14px;color:var(--muted);font-size:9px}.main{min-width:0;overflow:auto;scrollbar-color:var(--accent) transparent;scrollbar-width:thin;padding:20px 26px 24px;background:var(--surface)}.heading{display:flex;align-items:start;justify-content:space-between;gap:8px;margin-bottom:20px}.eyebrow{color:var(--accent);font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}.heading h2{font-size:22px;line-height:1.15;margin:4px 0 4px;letter-spacing:-.04em;font-weight:700}.heading p{margin:0;color:var(--muted);font-size:10px}.save{border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--fg);padding:7px 10px;white-space:nowrap;cursor:pointer;font:inherit;font-size:9px}.save:hover{border-color:var(--accent);color:var(--accent)}.section{margin-top:16px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px}.section-head b{font-size:11px}.section-head em{font-style:normal;color:var(--muted);font-size:9px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.value{color:var(--accent);font-variant-numeric:tabular-nums;font-size:10px}.bar{height:3px;background:var(--line);border-radius:3px;margin-top:8px;position:relative}.bar:before{content:'';display:block;height:100%;width:42%;background:var(--accent);border-radius:3px}.bar:after{content:'';position:absolute;left:42%;top:50%;width:10px;height:10px;border-radius:50%;background:var(--fg);border:2px solid var(--accent);transform:translate(-50%,-50%)}.bar.b2:before{width:62%}.bar.b2:after{left:62%}.slider-row{margin:8px 0 18px}.slider-row .line{display:flex;justify-content:space-between;gap:8px}.segmented{display:flex;gap:3px;padding:3px;background:var(--bg);border-radius:7px}.segmented button{flex:1;border:0;border-radius:5px;padding:7px 4px;background:transparent;color:var(--muted);font:inherit;font-size:9px;cursor:pointer}.segmented button:hover{color:var(--fg)}.segmented button.selected{background:var(--soft);color:var(--fg);font-weight:700;box-shadow:0 1px 4px #0004}.switch{width:26px;height:15px;border:0;border-radius:12px;background:var(--accent);padding:2px;cursor:pointer;flex:none}.switch:after{content:'';display:block;width:11px;height:11px;background:#fff;border-radius:50%;transform:translateX(11px);transition:transform .18s}.switch.off{background:var(--line)}.switch.off:after{transform:translateX(0)}.tooltip-area{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.tip-preview{margin-top:12px;min-height:56px;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px dashed var(--line);border-radius:7px}.bubble{background:var(--surface);color:var(--fg);border:1px solid var(--accent);border-radius:8px;padding:8px 13px;font-size:10px;box-shadow:0 8px 22px #0006;transition:border-radius .2s,border-color .2s}.bubble.square{border-radius:0}.bubble.rounded{border-radius:12px}.bubble.transparent{border-color:transparent}.hint{font-size:9px;color:var(--muted);margin:9px 0 0}.trackpad-content{display:none}.trackpad-content.visible,.windows-content.visible{display:block}.windows-content:not(.visible){display:none}.toast{position:absolute;right:20px;bottom:16px;padding:7px 12px;background:var(--accent);color:#171820;border-radius:6px;font-size:10px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.mock{position:relative}
/* A — Apple composure with a pulse: soft surfaces, grouped controls, tactile warmth. */
.a{--bg:#1b1c21;--side:#1a1b20;--surface:#24252a;--line:#393a42;--fg:#f1f1f3;--muted:#a5a6ae;--accent:#f4aa57;--soft:#36312d}.a .main{padding:23px 30px}.a .section{padding:12px 14px 8px;background:#2b2c32;border:1px solid #404149;border-radius:11px}.a .tooltip-area{margin:14px -14px -8px;padding:14px;border-radius:0 0 11px 11px;background:#27282e}.a .nav button.active{box-shadow:inset 3px 0 var(--accent)}.a .profile{border:0;background:#25262d;border-radius:8px}.a .heading h2{font-size:24px}.a .save{background:var(--accent);border-color:var(--accent);color:#231e19;font-weight:700}.a .segmented{background:#1f2026}.a .segmented button.selected{background:#454046}.a .tip-preview{background:#202126}
/* B — Omarchy Precision: restrained geometry, mono readouts, keyboard-minded. */
.b{--bg:#101112;--side:#0b0c0d;--surface:#151719;--line:#303337;--fg:#dedfdb;--muted:#92958f;--accent:#e6a046;--soft:#232521}.b .top{border-bottom:1px solid #5b503d}.b .brand-mark{background:none;color:var(--accent);border:1px solid var(--accent);border-radius:2px}.b .nav button{border-radius:2px}.b .nav button.active{background:#25261e;color:var(--accent)}.b .nav button.active:before{content:'›';margin-left:-7px;margin-right:6px}.b .main{padding:20px 27px}.b .heading h2{font-size:19px;letter-spacing:-.025em}.b .section{border-top:1px solid var(--line);padding-top:13px}.b .section-head b{color:var(--accent);text-transform:uppercase;font-size:9px;letter-spacing:.07em}.b .row{padding:8px 0}.b .segmented{border:1px solid var(--line);border-radius:3px;padding:0;background:none}.b .segmented button{border-radius:0;border-right:1px solid var(--line)}.b .segmented button:last-child{border:0}.b .segmented button.selected{background:var(--accent);color:#141414;box-shadow:none}.b .bubble{border-radius:2px}.b .tip-preview{border-radius:2px;background:#101112}.b .save{border-radius:2px}.b .profile{border-color:#444640}.b .switch,.b .switch:after{border-radius:2px}
/* C — Studio: stronger rhythm and a live specimen, without dashboard clutter. */
.c{--bg:#161923;--side:#11151d;--surface:#1c2230;--line:#354154;--fg:#f1f3f7;--muted:#a2afc0;--accent:#cfa3ff;--soft:#303149}.c .top{background:#191e29}.c .brand-mark{background:linear-gradient(135deg,#cfa3ff,#8eacd8);border-radius:7px}.c .nav button.active{box-shadow:inset 3px 0 var(--accent),0 1px 12px #cfa3ff10}.c .profile{background:#202532;border:1px solid var(--line);border-radius:8px}.c .main{padding:22px 28px}.c .heading h2{font-size:23px}.c .section{padding:12px 14px 10px;border-radius:9px;background:#222a38}.c .section:first-of-type{border-left:2px solid var(--accent)}.c .tooltip-area{background:#181e29;border:1px solid var(--line);padding:12px;border-radius:9px}.c .tip-preview{background:radial-gradient(circle at 50% 30%,#3e3854,#141a23 80%);min-height:70px;border:0}.c .bubble{background:#303849;border-color:var(--accent);box-shadow:0 9px 20px #0008}.c .save{color:var(--accent);border-color:var(--accent)}.c .segmented{background:#171e29}.c .segmented button.selected{background:#3c3c53}.c .eyebrow{letter-spacing:.18em}
@media(max-width:600px){.mock{grid-template-columns:115px minmax(0,1fr);font-size:10px}.profile{margin:9px 5px;padding:8px 6px}.side-foot{margin: auto 6px 8px}.nav{padding:0 4px}.nav button{padding:8px 5px;font-size:8px}.nav button.dev:after{display:none}.main,.a .main,.b .main,.c .main{padding:12px}.heading h2,.a .heading h2,.c .heading h2{font-size:18px}.heading p{max-width:180px}.top{padding:0 9px}.top-right{gap:4px}.caption{display:block}.caption span{display:block}.section{padding:8px}.a .section,.c .section{padding:8px}.segmented button{font-size:7px}.save{font-size:8px;padding:5px}.row{padding:7px 0}}
/* Typography belongs to the system, not to a visual direction. */
body{font-family:system-ui}.mock{--font:system-ui;grid-template-rows:50px 620px}.nav button.dev{position:relative;padding-right:28px}.nav button.dev:after{position:absolute;right:7px;top:11px;float:none}
</style></head><body><div class="gallery"><div class="intro"><h1>Ronda 2 · la misma fuente de sistema</h1><p>Dos estilos, ninguna tipografía impuesta. Conservamos el orden y los tooltips. Solo HTML de prueba: el panel instalado no cambia.</p></div>
<div id="gallery"></div></div>
<script>
const nav=['Trackpad','Ventanas','Pantallas','Teclado e idioma','Dispositivos','Dispositivos de red','Backup','Perfiles'];
const variants=[['b','02 · Omarchy preciso','Estructura limpia, menos tarjetas y estados claros. Ahora con la fuente de sistema.'],['c','03 · Studio','Más profundidad y carácter, sin cambiar la fuente ni la navegación.']];
function markup([cls,name,desc]){return `<section class="variant"><div class="caption"><b>${name}</b><span>${desc}</span></div><div class="frame"><div class="mock ${cls}"><header class="top"><div class="brand"><span class="brand-mark">⌘</span> Omarchy <span style="opacity:.36">/</span> Control Panel</div><div class="top-right"><span>Perfil: Personal</span><span class="window-dot">×</span></div></header><aside class="side"><div class="profile"><small>PERFIL ACTUAL</small><strong>Personal</strong></div><nav class="nav">${nav.map((n,i)=>`<button type="button" data-page="${i}" class="${i===1?'active':''} ${i===5||i===6?'dev':''}">${n}</button>`).join('')}</nav><div class="side-foot">OMARCHY · SISTEMA</div></aside><main class="main"><div class="heading"><div><div class="eyebrow">Ajustes del sistema</div><h2 class="page-title">Ventanas</h2><p class="page-sub">Espacio, comportamiento y detalles de la interfaz.</p></div><button class="save" type="button">Guardar en perfil</button></div><div class="windows-content visible"><div class="section"><div class="section-head"><b>Distribución</b><em>Se aplica al instante</em></div><div class="slider-row"><div class="line"><span>Separación interna</span><span class="value">6 px</span></div><div class="bar"></div></div><div class="slider-row"><div class="line"><span>Separación externa</span><span class="value">10 px</span></div><div class="bar b2"></div></div><div class="row"><span>Tamaño base de fuente<small>Ventanas y aplicaciones compatibles</small></span><span class="value">12 px</span></div></div><div class="tooltip-area"><div class="section-head"><b>Apariencia de las ayudas emergentes</b><em>Vista previa</em></div><div class="row"><span>Forma</span></div><div class="segmented shape"><button type="button" data-shape="theme" class="selected">Tema</button><button type="button" data-shape="square">Cuadrado</button><button type="button" data-shape="rounded">Redondeado</button></div><div class="row"><span>Color del borde</span></div><div class="segmented border-mode"><button type="button" data-border="theme" class="selected">Tema</button><button type="button" data-border="transparent">Transparente</button><button type="button" data-border="custom">Personalizado</button></div><div class="tip-preview"><span class="bubble">Ayuda emergente · Vista previa</span></div><p class="hint">«Tema» sigue el estilo y los colores actuales de Omarchy.</p></div></div><div class="trackpad-content"><div class="section"><div class="section-head"><b>Trackpad</b><em>apple-mtp-multi-touch</em></div><div class="slider-row"><div class="line"><span>Sensibilidad global</span><span class="value">0,80</span></div><div class="bar b2"></div></div><div class="row"><span>Desplazamiento natural<small>Invierte la dirección al deslizar</small></span><button type="button" class="switch" aria-label="Desplazamiento natural"></button></div><div class="row"><span>Tocar para hacer clic</span><button type="button" class="switch" aria-label="Tocar para hacer clic"></button></div><div class="row"><span>Inercia al desplazarse</span><button type="button" class="switch off" aria-label="Inercia al desplazarse"></button></div></div><div class="section"><div class="section-head"><b>Respuesta del trackpad</b><em>Activo · Ágil</em></div><p class="hint">Recorridos cortos más vivos sin perder precisión en movimientos finos.</p><div class="tip-preview"><span style="color:var(--accent)">◇ ┄ ┄ ◇ ┄ ┄ ◆ ┄ ┄ ◇</span></div></div></div></main><div class="toast">Configuración de ejemplo · no se guardó nada</div></div></div></section>`}
document.getElementById('gallery').innerHTML=variants.map(markup).join('');
document.addEventListener('click',e=>{const mock=e.target.closest('.mock');if(!mock)return;const navButton=e.target.closest('[data-page]');if(navButton){const i=Number(navButton.dataset.page);if(i!==0&&i!==1){const t=mock.querySelector('.toast');t.textContent='Solo Ventanas y Trackpad están maquetados';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900);return}mock.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===navButton));mock.querySelector('.page-title').textContent=i===1?'Ventanas':'Trackpad';mock.querySelector('.page-sub').textContent=i===1?'Espacio, comportamiento y detalles de la interfaz.':'Gestos y respuesta precisa del puntero.';mock.querySelector('.windows-content').classList.toggle('visible',i===1);mock.querySelector('.trackpad-content').classList.toggle('visible',i===0)}const shape=e.target.closest('[data-shape]');if(shape){mock.querySelectorAll('[data-shape]').forEach(x=>x.classList.toggle('selected',x===shape));mock.querySelector('.bubble').classList.remove('square','rounded');if(shape.dataset.shape!=='theme')mock.querySelector('.bubble').classList.add(shape.dataset.shape)}const border=e.target.closest('[data-border]');if(border){mock.querySelectorAll('[data-border]').forEach(x=>x.classList.toggle('selected',x===border));mock.querySelector('.bubble').classList.toggle('transparent',border.dataset.border==='transparent');if(border.dataset.border==='custom'){const t=mock.querySelector('.toast');t.textContent='El selector de color vendrá en la siguiente iteración';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}}const sw=e.target.closest('.switch');if(sw)sw.classList.toggle('off');if(e.target.closest('.save')){const t=mock.querySelector('.toast');t.textContent='Maqueta: no se modificó ninguna configuración';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}});
console.log('Round 2 ready: two directions, shared system-ui font, navigation and tooltip controls preserved.');
</script></body></html>
